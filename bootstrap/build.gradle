apply from: rootProject.file('gradle/build-stamp.gradle')

// Build identity: a jar must be traceable to the revision and the working tree it was built from.
// The root project exposes only an abbreviated commit, so the product manifests additionally carry
// the full commit, that abbreviation and the tree state; a dirty build marks itself instead of
// looking like a release of the commit it names. This script is not part of the generated-mapping
// cache digest (see the Arclight plugin), so these reads cannot rewrite generated artifacts.
def git = { List<String> args ->
    def stdout = new ByteArrayOutputStream()
    exec {
        workingDir rootProject.projectDir
        commandLine(['git'] + args)
        standardOutput = stdout
        errorOutput = new ByteArrayOutputStream()
    }
    return stdout.toString().trim()
}
def gitCommit = git(['rev-parse', 'HEAD'])
def gitStatus = git(['status', '--porcelain'])
def gitDirty = !gitStatus.isEmpty()
def gitChangeCount = gitStatus.isEmpty() ? 0 : gitStatus.readLines().size()
def gitState = gitDirty ? 'dirty' : 'clean'
def releaseVersion = project.version.toString().replace('-SNAPSHOT', '')

