// The artifact that will be loaded must be addressable by revision: the default SNAPSHOT name is
// overwritten by every build, so a copy whose name carries the commit (and a dirty marker) is kept
// next to it with a sidecar record of its hashes, size and build time. The default name is kept.
def retainedName = "PRTS-neoforge-${libs.versions.minecraft.get()}-${releaseVersion}-${gitHash}${gitDirty ? '-dirty' : ''}.jar"

tasks.register('retainNeoforgeJar') {
    group = 'build'
    description = 'Copy the NeoForge server jar under a revision-addressed name and record its identity.'
    dependsOn tasks.named('neoforgeJar')
    def sourceJar = tasks.named('neoforgeJar').flatMap { it.archiveFile }
    def retainedJar = project.layout.buildDirectory.file("artifacts/${retainedName}")
    def identityRecord = project.layout.buildDirectory.file("artifacts/${retainedName}.identity.txt")
    inputs.file(sourceJar)
    outputs.file(retainedJar)
    outputs.file(identityRecord)
    doLast {
        def source = sourceJar.get().asFile
        def target = retainedJar.get().asFile
        target.parentFile.mkdirs()
        java.nio.file.Files.copy(source.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        def bytes = target.bytes
        def digest = { String algorithm ->
            java.util.HexFormat.of().formatHex(java.security.MessageDigest.getInstance(algorithm).digest(bytes))
        }
        identityRecord.get().asFile.text = [
                "artifact=${retainedName}",
                "source=${source.name}",
                "md5=${digest('MD5')}",
                "sha256=${digest('SHA-256')}",
                "bytes=${bytes.length}",
                "retained_at=${java.time.OffsetDateTime.now().format(java.time.format.DateTimeFormatter.ISO_OFFSET_DATE_TIME)}",
                "commit_timestamp=${buildTimestamp}",
                "git_commit=${gitCommit}",
                "git_commit_short=${gitHash}",
                "git_tree=${gitState}",
                "git_changes=${gitChangeCount}",
                "java_version=${System.getProperty('java.version')}",
                "gradle_version=${project.gradle.gradleVersion}",
        ].join(System.lineSeparator()) + System.lineSeparator()
    }
}

tasks.named('neoforgeJar').configure {
    finalizedBy 'retainNeoforgeJar'
}

tasks.register('generateInstallerInfo', GenerateInstallerInfo) {
    neoforgeVersion = libs.versions.neoforge.get()
    minecraftVersion = libs.versions.minecraft.get()
    fabricLoaderVersion = libs.versions.fabric.loader.get()
    def installer = file('build/arclight_installer/META-INF/installer.json')
    outputs.file(installer)
    configuration = project.configurations.installer
    fabricExtra = project.configurations.installerFabric
}

