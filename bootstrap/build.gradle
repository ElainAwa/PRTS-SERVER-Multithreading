// TerminalConsoleAppender + jline + jansi must be in the bootstrap jar for NeoForge
// so minecraftFormatting (§→ANSI) converter works at startup (banner, plugin colors).
// Forge gets these transitively from fmlloader; Fabric has them in installerLibsFabric.
// NeoForge needs them explicitly here.
// NOTE: Must exclude log4j-core/log4j-api from terminalconsoleappender — it pulls in
// ancient 2.8.1 which splits packages with log4j-core:2.22.1 already on classpath,
// causing java.lang.module.ResolutionException at startup.
embed('net.minecrell:terminalconsoleappender:1.2.0') {
    exclude group: 'org.apache.logging.log4j', module: 'log4j-core'
    exclude group: 'org.apache.logging.log4j', module: 'log4j-api'
}
embed 'org.jline:jline-terminal:3.12.1'
embed 'org.jline:jline-reader:3.12.1'
embed 'org.fusesource.jansi:jansi:1.18'
// i18n (configurate) is required at NeoForge bootstrap runtime but was NOT packaged:
// configurate is excluded by `transitive = false` on i18n-config, so embed it explicitly.
// NOTE: log4j-jul is intentionally NOT embedded — NeoForge already ships a
// org.apache.logging.log4j.jul module on the module path; embedding it into the
// luminara.boot automatic module triggers a split-package ResolutionException
// (org.apache.logging.log4j.status). The JUL->log4j bridge failing to load is
// non-fatal (JUL falls back to its default manager), so we rely on the external one.
embed 'org.spongepowered:configurate-core:3.6.1'
embed 'org.spongepowered:configurate-hocon:3.6.1'
embed 'com.typesafe:config:1.3.1'
}

