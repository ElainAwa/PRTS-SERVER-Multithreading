tasks.register('neoforgeJar', Jar) {
    archiveBaseName.set "PRTS-neoforge-${libs.versions.minecraft.get()}"
    // Reproducibility: entry times come from source mtimes and entry order from the walk order,
    // so both are pinned to the archive defaults instead of the build machine's clock and disk.
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest.attributes 'Main-Class': 'io.izzel.arclight.server.Launcher'
    manifest.attributes 'Implementation-Title': 'PRTS'
    manifest.attributes 'Implementation-Version': "PRTS-${libs.versions.minecraft.get()}-${project.version}-$gitHash${gitDirty ? '-dirty' : ''}"
    manifest.attributes 'Implementation-Vendor': 'PRTS Team'
    manifest.attributes 'Implementation-Timestamp': "$buildTimestamp"
    manifest.attributes 'Automatic-Module-Name': 'luminara.boot'
    manifest.attributes 'Git-Commit': gitCommit
    manifest.attributes 'Git-Commit-Short': gitHash
    manifest.attributes 'Git-Tree': gitState
    manifest.attributes 'Git-Changes': gitChangeCount.toString()
    from(configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude 'LICENSE.txt'
        exclude 'META-INF/services/**'
        exclude 'org/apache/commons/lang/enum/**'
        exclude 'com/google/common/**'
    }
    into('/') {
        it.from(project(':arclight-neoforge').tasks.relocateCraftBukkit.outputs.files.collect())
        it.rename { name -> 'common.jar' }
    }
    into('/') {
        it.from(configurations.gson.collect())
        it.rename { name -> 'gson.jar' }
    }
    from sourceSets.applaunch.output
    from sourceSets.main.output
    from sourceSets.neoforge.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn(project(':arclight-neoforge').tasks.build)
}

