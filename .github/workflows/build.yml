name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew collect --no-daemon --stacktrace

      - name: Toolchain invariant - @Redirect.at must be a nested annotation
        run: |
          curl -fsSLo /tmp/asm.jar https://repo1.maven.org/maven2/org/ow2/asm/asm/9.7.1/asm-9.7.1.jar
          java -cp /tmp/asm.jar .github/scripts/ScanAt.java arclight-common/build/classes/java/main | tee /tmp/scan.txt
          grep -Eq "ANNOTATION=[1-9][0-9]* LIST=0" /tmp/scan.txt

      - name: Manifest sanity (no -dirty, version carries the commit hash)
        run: |
          JAR=$(ls bootstrap/build/libs/PRTS-neoforge-*.jar | head -1)
          echo "jar: $JAR"
          unzip -p "$JAR" META-INF/MANIFEST.MF | tee /tmp/mf.txt
          ! grep -qi -- "-dirty" /tmp/mf.txt
          grep -Eq "Implementation-Version: PRTS-[0-9.]+[^ ]*-[0-9a-f]{7}" /tmp/mf.txt

      - name: Upload server jar
        uses: actions/upload-artifact@v4
        with:
          name: PRTS-server-jar
          path: bootstrap/build/libs/PRTS-neoforge-*.jar