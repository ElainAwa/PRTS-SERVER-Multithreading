_v = 1

locale {
  fallback = "en_us"
}
optimization {
  cache-plugin-class = true
  disable-data-fixer = false
  goal-selector-update-interval = 2
  use-activation-and-tracking-range = true
}
compatibility {
  material-property-overrides {
  }
  entity-property-overrides {
  }
  symlink-world = false
  extra-logic-worlds = [
    "com.example.mod.ExtraLogicWorld",
    "xyz.nucleoid.fantasy.RuntimeWorld"
  ]
  forward-permission = true
  valid-username-regex = ""
  isolate-plugin-class-loaders = [
    "com.example.mod.package.aaaa"
  ]
  isolate-adventure-from-modloader = false
}
async-catcher {
  dump = true
  warn = true
  defaultOperation = block
  overrides {
  }
}
velocity {
  enable = false
  secret = ""
}
experimental {
  replaceable-base-world-generator = false
}
# PRTS-owned code tree (io.izzel.arclight.common.prts). One master switch per category:
# turn a whole category off when the new kernel takes over the seam it serves.
# See docs/PRTS-CONVENTIONS.md, C-003.
prts {
  fixes {
    enabled = true
  }
  modsupport {
    enabled = true
  }
  performance {
    enabled = true
  }
  optional {
    servercore {
      enabled = false
    }
  }
}